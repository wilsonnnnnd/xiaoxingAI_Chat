name: Deploy to Azure VM

on:
  pull_request:
    branches:
      - main
    types:
      - closed

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Sync latest code on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            set -e
            cd /home/weimeng/xiaoxingAI
            git fetch origin main
            git reset --hard origin/main

      - name: Build frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 22
            cd /home/weimeng/xiaoxingAI/frontend
            npm install
            npm run build

      - name: Publish frontend to nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            set -e
            sudo mkdir -p /var/www/xiaoxing
            sudo rm -rf /var/www/xiaoxing/*
            sudo cp -r /home/weimeng/xiaoxingAI/frontend/dist/* /var/www/xiaoxing/
            sudo chown -R www-data:www-data /var/www/xiaoxing
            sudo chmod -R 755 /var/www/xiaoxing

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            set -e
            sudo nginx -t
            sudo systemctl reload nginx

      - name: Check public HTTPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            set -e
            curl -I https://xiaoxingai.online

      - name: Stop backend, database, and Redis
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            set -e
            sudo systemctl stop xiaoxing || true
            sudo systemctl stop postgresql || true
            sudo systemctl stop redis-server || sudo systemctl stop redis || true
            sudo systemctl status xiaoxing --no-pager || true
            sudo systemctl status postgresql --no-pager || true
            sudo systemctl status redis-server --no-pager || sudo systemctl status redis --no-pager || true
